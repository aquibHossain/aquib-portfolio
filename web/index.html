<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="Aquib Hossain builds websites and renovates them. Portfolio, experience, and how to get in touch."
    />

    <title>Aquib Hossain — Developer</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      document.documentElement.classList.add("js");
      try {
        var stored = localStorage.getItem("aquib-theme");
        document.documentElement.setAttribute(
          "data-theme",
          stored === "light" ? "light" : "dark"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
